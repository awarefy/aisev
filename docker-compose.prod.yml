  #   environment:
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_NAME}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisev-backend
    restart: always
    # depends_on:
    #   postgresdb:
    #     condition: service_healthy
    extra_hosts:
      - "${DOCKER_HOST_NAME:-host.docker.internal}:${DOCKER_HOST_IP:-host-gateway}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: aisev-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: aisev-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - manager-backend

  manager-backend:
    build:
      context: ./llm-evaluation-system/manager-backend
      dockerfile: Dockerfile
    container_name: aisev-manager-backend
    restart: always
    environment:
      AUTOMATED_RT_IMAGE: automated-rt-app:latest
      HOST: ${LLM_EVAL_HOST:-localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - automated-rt-app
    expose:
      - "5010"

  automated-rt-app:
    build:
      context: ./llm-evaluation-system/automated_rt
      dockerfile: Dockerfile
    image: automated-rt-app:latest
    container_name: aisev-automated-rt-app
    restart: always
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "18001:8000"

